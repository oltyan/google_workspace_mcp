services:
  gws_mcp:
    build: .
    container_name: gws_mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_MCP_CREDENTIALS_DIR=/app/store_creds
      - GOOGLE_OAUTH_REDIRECT_URI=https://mcp.musicalmycology.org/oauth2callback
    volumes:
      - store_creds:/app/store_creds:rw
    env_file:
      - .env
    networks:
      - default
      - shared-tunnel
    labels:
      homebody.enable: "true"
      homebody.hostname: "mcp.musicalmycology.org"
      homebody.service: "http://gws_mcp:8000"

networks:
  shared-tunnel:
    external: true

volumes:
  store_creds: